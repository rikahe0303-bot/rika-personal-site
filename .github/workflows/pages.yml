name: Deploy Rika to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # One-time source migration. Subsequent pushes build the checked-in files directly.
      - name: Import full source when migrating from the archived website
        if: ${{ hashFiles('rika-source.zip') != '' && hashFiles('package.json') == '' }}
        run: |
          unzip -q -o rika-source.zip
          rm -f rika-source.zip 'Rika-GitHub-Pages静态网站.zip' 'Rika个人网站源码.zip'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Rika journal source for GitHub Pages"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Sync published radar data
        run: node scripts/sync-radar.mjs
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
