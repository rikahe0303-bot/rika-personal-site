<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171713">
<meta name="description" content="从抖音画面中收集的 27 张 B-roll 参考截图，涵盖图片、视频、文字和图表。">
<title>B-roll 画面参考库</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./gallery-data.js"></script>
<script defer src="./gallery.js"></script>
</head>
<body>
<header class="hero">
  <div class="masthead shell"><a href="#top" class="wordmark">B<span>·</span>ROLL</a><a class="jump" href="#gallery">浏览图库 <span aria-hidden="true">↓</span></a></div>
  <div class="hero-inner shell" id="top">
    <div class="hero-copy"><p class="eyebrow">短视频剪辑参考</p><h1>B-roll<br>画面参考库<span>.</span></h1><p class="intro">27 张抖音截图，记录图片、视频、文字和图表怎样在画面里传递信息。</p></div>
    <div class="hero-visual" aria-hidden="true"><img src="./assets/frame-01.jpg" alt=""><img src="./assets/frame-22.jpg" alt=""><img src="./assets/frame-25.jpg" alt=""></div>
  </div>
</header>
<main id="gallery" class="shell">
  <div class="toolbar">
    <div class="filters" role="group" aria-label="按分类筛选"></div>
    <p class="count" aria-live="polite"></p>
  </div>
  <div class="collection"></div>
  <noscript><p>请开启 JavaScript 浏览图库。</p></noscript>
</main>
<footer class="shell footer"><span>B·ROLL 画面参考库</span><a href="#top">回到顶部 ↑</a></footer>
<dialog aria-label="图片大图">
  <div class="viewer">
    <div class="viewer-bar"><span class="viewer-count"></span><button class="close" aria-label="关闭大图">×</button></div>
    <div class="viewer-photo"><button class="prev" aria-label="上一张">‹</button><img alt=""><button class="next" aria-label="下一张">›</button></div>
    <div class="viewer-info"><div><p class="viewer-group"></p><h2 class="viewer-title"></h2></div><a class="source" target="_blank" rel="noopener noreferrer">抖音原帖 ↗</a></div>
  </div>
</dialog>
</body>
</html>
