<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>万圣夜 3D 游乐园</title>
  <meta name="description" content="可漫游、可旋转视角并能释放烟花的万圣夜 Three.js 游乐园" />
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030410}body{font-family:system-ui,sans-serif;cursor:grab}body:active{cursor:grabbing}canvas{display:block;width:100%;height:100%}.veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 0 38%,rgba(4,2,13,.2) 68%,rgba(0,0,5,.72) 100%);mix-blend-mode:multiply}.grain{position:fixed;inset:0;pointer-events:none;opacity:.09;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E")}
    #loader{position:fixed;inset:0;display:grid;place-items:center;color:#ffad4d;letter-spacing:.3em;font-size:12px;background:#030410;transition:opacity 1s}.ready #loader{opacity:0;pointer-events:none}.title{position:fixed;z-index:3;left:clamp(20px,4vw,58px);top:clamp(22px,5vw,60px);margin:0;color:#fff5dc;font:600 clamp(20px,3vw,40px)/1.05 Georgia,serif;letter-spacing:.08em;text-shadow:0 0 22px rgba(110,135,255,.55);pointer-events:none}.caption{position:fixed;z-index:3;left:50%;bottom:clamp(22px,4vw,48px);transform:translateX(-50%);width:min(88vw,820px);margin:0;text-align:center;color:rgba(255,239,213,.82);font-size:clamp(12px,1.4vw,17px);letter-spacing:.12em;text-shadow:0 2px 14px #000;pointer-events:none}@media(max-width:640px){.title{font-size:22px}.caption{bottom:24px;line-height:1.6}}
  </style>
</head>
<body>
  <h1 class="title">万圣夜游乐园</h1><p class="caption">拖动旋转视角 · 滚轮缩放 · 点击夜空释放烟花</p><div id="loader">万圣夜即将开园</div><div class="veil"></div><div class="grain"></div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
  <script type="module" src="./scene.js"></script>
</body>
</html>
