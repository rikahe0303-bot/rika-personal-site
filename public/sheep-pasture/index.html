function store(){try{localStorage.setItem('storybook-sheep-v1',JSON.stringify(sheep.map(s=>({id:s.id,name:s.name,color:s.color,hat:s.hat,bio:s.bio,x:s.x,z:s.z}))))}catch(e){}try{localStorage.setItem('storybook-grass-v1',JSON.stringify(patches.map(p=>[p.x,p.z])))}catch(e){}}
let saved;try{saved=JSON.parse(localStorage.getItem('storybook-sheep-v1')||'null')}catch(e){}if(Array.isArray(saved)){saved.slice(0,16).forEach(addSheep)}else{addSheep({name:'棉花',x:-1.5,z:.9});addSheep({name:'豆豆',x:1.2,z:2.2,color:1,hat:'小花冠'});addSheep({name:'云朵',x:-3.6,z:3,color:3})}
function project(s){let v=s.group.position.clone().add(new THREE.Vector3(0,2,0)).project(camera);return {x:(v.x+1)*innerWidth/2,y:(1-v.y)*innerHeight/2}}function updateToolbar(){if(panel.classList.contains('open')){toolbar.classList.remove('show');return}if(!selected){toolbar.classList.remove('show');return}let p=project(selected);toolbar.style.left=clamp(p.x,90,innerWidth-90)+'px';toolbar.style.top=clamp(p.y,58,innerHeight-30)+'px';toolbar.classList.add('show')}
function select(s){selected=s;updateToolbar();if(panel.classList.contains('open'))fillPanel()}function fillPanel(){if(!selected)return;document.getElementById('name').value=selected.name;document.getElementById('bio').value=selected.bio;drawOptions()}
function drawOptions(){const sw=document.getElementById('swatches');sw.innerHTML='';colors.forEach(([n,c],i)=>{let b=document.createElement('button');b.className='swatch'+(selected?.color===i?' active':'');b.title=n;b.setAttribute('aria-label',n);b.style.setProperty('--c',c);b.onclick=()=>{if(!selected)return;selected.color=i;refreshCoat(selected);drawOptions();store()};sw.appendChild(b)});const ch=document.getElementById('choices');ch.innerHTML='';hats.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.className=selected?.hat===n?'active':'';b.onclick=()=>{if(!selected)return;selected.hat=n;buildHat(selected);drawOptions();store()};ch.appendChild(b)})}
function openPanel(){if(!selected)return;fillPanel();panel.classList.add('open');targetShift=2.25}function closePanel(){panel.classList.remove('open');targetShift=0}document.getElementById('dress').onclick=openPanel;document.getElementById('close').onclick=closePanel;document.getElementById('done').onclick=()=>{store();closePanel()};document.getElementById('name').oninput=e=>{if(selected){selected.name=e.target.value;store()}};document.getElementById('bio').oninput=e=>{if(selected){selected.bio=e.target.value;store()}};document.getElementById('copy').onclick=()=>{if(!selected)return;let base=selected,pos=null;for(let r=1.55;r<4&&!pos;r+=.35)for(let i=0;i<20;i++){let a=i*6.28/20,x=base.x+Math.cos(a)*r,z=base.z+Math.sin(a)*r;if(safe(x,z)&&sheep.every(q=>Math.hypot(q.x-x,q.z-z)>1.45)){pos=[x,z];break}}pos=pos||nearest(base.x+1.5,base.z);let s=addSheep({name:base.name+'仔',color:base.color,hat:base.hat,bio:base.bio,x:pos[0],z:pos[1]});select(s);store()};document.getElementById('remove').onclick=()=>{if(!selected)return;scene.remove(selected.group);sheep.splice(sheep.indexOf(selected),1);select(null);closePanel();store()};
function pointer(e){let r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera)}renderer.domElement.addEventListener('pointerdown',e=>{pointer(e);let hits=ray.intersectObjects(sheep.map(s=>s.group),true);let s=hits.find(h=>h.object.userData.sheep)?.object.userData.sheep||null;if(s&&!planting){select(s);drag={s,x:e.clientX,y:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId)}else if(planting){if(ray.ray.intersectPlane(plane,hit))addGrassPatch(hit.x,hit.z)}else{select(null);closePanel()}});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;let d=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);if(d>6)drag.moved=true;if(!drag.moved)return;pointer(e);if(ray.ray.intersectPlane(plane,hit)){let [x,z]=nearest(hit.x,hit.z);drag.s.x=x;drag.s.z=z;drag.s.group.position.set(x,.22,z);drag.s.state='drag'}updateToolbar()});function release(){if(!drag)return;let s=drag.s;s.group.position.y=0;s.state='idle';s.timer=1.5;if(drag.moved)store();drag=null}renderer.domElement.addEventListener('pointerup',release);renderer.domElement.addEventListener('pointercancel',release);
function resize(){let w=innerWidth,h=innerHeight;renderer.setSize(w,h);let aspect=w/h;baseSpan=aspect<1.15?13:10.5;camera.left=-baseSpan*aspect;camera.right=baseSpan*aspect;camera.top=baseSpan;camera.bottom=-baseSpan;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden)store()});function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-last)/1000,.05);last=now;camShift+=(targetShift-camShift)*Math.min(1,dt*4);camera.zoom+=( (panel.classList.contains('open')?.86:1)-camera.zoom)*Math.min(1,dt*4);camera.updateProjectionMatrix();camera.position.x=13+camShift;camera.lookAt(camShift,0,0);for(let s of sheep){if(drag?.s===s)continue;s.phase+=dt;s.timer-=dt;if(s.timer<=0){s.state=rand()<.52?'walk':rand()<.24?'hop':'idle';s.timer=s.state==='walk'?rr(1.2,3):rr(.6,2.3);s.heading+=rr(-1.3,1.3)}if(s.state==='walk'){let speed=.27;let nx=s.x+Math.cos(s.heading)*speed*dt,nz=s.z+Math.sin(s.heading)*speed*dt;if(safe(nx,nz)){s.x=nx;s.z=nz}else{s.heading+=2;s.state='idle';s.timer=.5}let turn=-s.heading;s.group.rotation.y+=(turn-s.group.rotation.y)*Math.min(1,dt*3)}s.group.position.set(s.x,s.state==='hop'?Math.max(0,Math.sin(s.phase*9))*.21:0,s.z);s.body.position.y=Math.sin(s.phase*(s.state==='walk'?8:2.2))*(s.state==='walk'?.045:.018);s.headPivot.rotation.z=(s.state==='idle'?-.12:0)+Math.sin(s.phase*2)*.075;s.headPivot.rotation.y=Math.sin(s.phase*1.35)*.09;s.legs.forEach((l,i)=>l.rotation.z=s.state==='walk'?Math.sin(s.phase*8+i*Math.PI)*.22:0)}updateToolbar();renderer.render(scene,camera)}requestAnimationFrame(tick);
</script></body></html>
