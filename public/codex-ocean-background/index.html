<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Codex 写实浅海背景</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <video id="videoA" class="source-video" muted playsinline preload="auto"></video>
  <video id="videoB" class="source-video" muted playsinline preload="auto"></video>
  <canvas id="ocean" aria-label="写实浅海动态背景"></canvas>
  <video id="encounterVideo" class="encounter-video" muted playsinline preload="auto" loop></video>
  <div class="intro" id="intro" aria-hidden="true"><span>SHALLOW TIDE</span><small>真实浅海生态</small></div>
  <aside class="panel" id="panel" aria-label="动态背景设置">
    <div class="panel-head"><div><span class="eyebrow">CODEX BACKGROUND</span><h1>写实浅海</h1></div><button class="icon-button" id="collapse" type="button" aria-label="收起设置">−</button></div>
    <label><span>水体通透度 <output id="clarityValue"></output></span><input id="clarity" type="range" min="0.25" max="0.9" step="0.01" /></label>
    <label><span>波纹强度 <output id="rippleValue"></output></span><input id="ripple" type="range" min="0" max="1.5" step="0.01" /></label>
    <label><span>生物速度 <output id="speedValue"></output></span><input id="speed" type="range" min="0.5" max="1.5" step="0.01" /></label>
    <label><span>生物密度 <output id="densityValue"></output></span><input id="density" type="range" min="0.35" max="1.5" step="0.01" /></label>
    <div class="actions"><button id="encounter" type="button">召唤更多鱼群</button><button class="secondary" id="reset" type="button">恢复默认</button></div>
    <p class="hint">鼠标划过水面可触发折射水波 · H 隐藏面板</p>
  </aside>
  <button class="panel-tab" id="panelTab" type="button" aria-label="展开设置">≋</button>
  <div class="encounter-toast" id="toast" role="status"></div>
  <div class="fallback" id="fallback">真实浅海素材加载中</div>
  <script src="./app.js"></script>
</body>
</html>
